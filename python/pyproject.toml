[project]
name = "nhl-raw"
version = "0.0.1"
description = "Python port of the fastRhockey NHL raw scraper + PBP enrichment pipeline"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0,<2.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = ["pytest>=8.0"]
xg = ["xgboost>=2.0", "numpy>=1.26"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
