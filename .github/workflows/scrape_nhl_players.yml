name: Scrape NHL Player Bio

# Per-player bio capture (stage 02) -- `shootsCatches` and the stable identity
# fields, one payload per player under nhl/players/.
#
# WEEKLY, not daily, and that is the whole design: handedness never changes, so
# the only thing a run discovers is players who debuted since the last one. The
# stage is presence-plus-validity resumable, so a run with no new players fetches
# nothing and commits nothing -- the cost of scheduling it is a no-op, and the
# cost of NOT scheduling it is a roster join that silently degrades as rookies
# arrive.
#
# In-season months only (Oct-Jun), matching scrape_nhl_raw.yml's windows.

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Refetch every player, even those already captured'
        type: boolean
        default: false
      limit:
        description: 'Cap the run at N players (blank = no cap)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  # The REPO-WIDE commit lock, shared with scrape_nhl_raw.yml -- not a private
  # per-workflow group. Both workflows push to main and their schedules are one
  # hour apart (raw 08:00 daily in-season, this 09:00 Mondays), which a full
  # season scrape routinely overruns. Two jobs committing concurrently is how a
  # push gets rejected and a run goes green having published nothing; see that
  # workflow's header for three real worked examples.
  group: ${{ github.repository }}-commit
  cancel-in-progress: false

jobs:
  players:
    name: Capture NHL player bio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The work list comes from the sibling -data roster parquet, which this
          # runner cannot check out (that repo is large). Fetch the ids over HTTP
          # instead -- see the --rosters default in the stage.
          sparse-checkout: |
            python
            tests
            scripts
            pyproject.toml
            uv.lock
            nhl/players
            nhl/nhl_player_bio.parquet
          sparse-checkout-cone-mode: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --frozen --dev

      - name: Capture
        id: capture
        env:
          # Pace is env-only so it can be retuned here without a code change.
          NHL_PLAYERS_SLEEP: '0.25'
          PYTHONUNBUFFERED: '1'
          IN_FORCE: ${{ inputs.force }}
          IN_LIMIT: ${{ inputs.limit }}
        run: |
          set -uo pipefail
          # Inputs come through env, never interpolated into the script body:
          # `${{ inputs.limit }}` expands BEFORE bash parses, so a dispatch value
          # of `1; curl ...` would execute with this job's contents: write token.
          ARGS=""
          if [ "$IN_FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "$IN_LIMIT" ]; then ARGS="$ARGS --limit $IN_LIMIT"; fi
          # Roster ids over HTTP: the -data repo is not checked out here.
          ROSTERS="https://raw.githubusercontent.com/sportsdataverse/fastRhockey-nhl-data/main/nhl/game_rosters/parquet"
          # `set -uo pipefail` has no -e, and a trailing `echo` of $? always
          # succeeds -- so the stage's exit code was thrown away and a total
          # fetch failure would have left this step, and the job, GREEN. Capture
          # it instead: payloads that DID land are still committed below (capture
          # is resumable, partial progress is worth keeping), and a step after the
          # commit turns the job red so the failure is never silent.
          rc=0
          uv run --no-sync python -m nhl_raw_02_players_scrape \
            --root nhl --rosters "$ROSTERS" $ARGS || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "EXIT=$rc"

      - name: Commit new payloads
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Explicit paths, never `git add -A`: this job owns the payloads AND the
          # index derived from them. The index is a SEPARATE path outside
          # nhl/players/ -- staging only the directory would leave the consumer
          # reading a stale index forever while the payloads moved underneath it.
          git add nhl/players nhl/nhl_player_bio.parquet
          if git diff --cached --quiet; then
            echo "no new players -- nothing to commit (expected on most weeks)"
            exit 0
          fi
          n=$(git diff --cached --name-only | wc -l)
          git commit -m "feat(raw): nhl player bio refresh (${n} file(s))"
          # Rebase-and-retry: the concurrency lock serialises OUR two workflows,
          # but anything else landing on main between checkout and push still
          # rejects it as non-fast-forward -- and with bash -e that reds the job
          # with this week's payloads committed locally and never pushed.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt ${attempt}) -- rebasing on origin/main" >&2
            git pull --rebase --autostash origin main || break
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      - name: Fail on capture errors
        if: steps.capture.outputs.rc != '0'
        run: |
          echo "capture exited ${{ steps.capture.outputs.rc }} -- any payloads that landed were committed above;" >&2
          echo "the FETCH failures are why this job is red. Re-run: capture is resumable." >&2
          exit 1
