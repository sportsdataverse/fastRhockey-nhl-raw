on:
  push:
    # the nightly pregame-capture commit (scripts/nhl_pregame_snapshot.sh) is not a scrape;
    # nhl-data compiles it on its daily run, so it must not dispatch a season build
    paths-ignore:
      - 'nhl/pregame/**'
  workflow_dispatch:

name: fastRhockey NHL Data trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    fastRhockey_nhl_data_trigger:
        runs-on: ubuntu-latest
        # `on: push` has no branch filter here, and the dispatch payload is hardcoded to
        # refs/heads/main, so a feature-branch or tag push started a production build of
        # work that had not landed (cfbfastR-cfb-raw#10). Same guard as that repo.
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Trigger fastRhockey NHL Data
              uses: peter-evans/repository-dispatch@v4
              with:
                  token: ${{ secrets.SDV_GH_TOKEN }}
                  repository: sportsdataverse/fastRhockey-nhl-data
                  event-type: daily_nhl_data
                  client-payload: |-
                    {
                      "ref": "refs/heads/main",
                      "event_name": "daily_nhl_data",
                      "commit_message": ${{ toJSON(github.event.head_commit.message) }}
                    }
